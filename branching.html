<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSE110 Branching Visualizer</title>
<meta name="description" content="Bilingual (Bangla + English) interactive guide to Java branching for BRACU CSE110 Lab Assignment 02.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>/* Layout concept: a lab notebook with a flowchart stencil — navy ink on faint grid paper,
   an amber highlighter marking the step that is running, true/false as green/red ink. */
:root {
  --paper: #f5f7fa;
  --grid: #e4e9f0;
  --panel: #ffffff;
  --ink: #14243a;
  --muted: #5a6a80;
  --line: #d3dbe6;
  --accent: #1d5bbf;
  --accent-soft: #e3ecfa;
  --hl: #e89a0c;
  --hl-soft: #fff1d6;
  --true: #17865a;
  --true-soft: #def4ea;
  --false: #c23a49;
  --false-soft: #fbe5e8;
  --codebg: #102036;
  --codeink: #dbe6f5;
  --font-display: 'Anek Bangla', 'Hind Siliguri', 'IBM Plex Sans', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Hind Siliguri', system-ui, sans-serif;
  --font-bn: 'Hind Siliguri', 'Anek Bangla', 'Noto Sans Bengali', 'Nirmala UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #0d1520; --grid: #142133; --panel: #131f30; --ink: #e5ecf5; --muted: #9babc0; --line: #26384f;
    --accent: #6ea6ff; --accent-soft: #1a2c47; --hl: #ffb938; --hl-soft: #3a2c10; --true: #3fcf8f; --true-soft: #12352a;
    --false: #ff6f7d; --false-soft: #3d1a20; --codebg: #0a1322; --codeink: #d5e1f2; color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --paper: #0d1520; --grid: #142133; --panel: #131f30; --ink: #e5ecf5; --muted: #9babc0; --line: #26384f;
  --accent: #6ea6ff; --accent-soft: #1a2c47; --hl: #ffb938; --hl-soft: #3a2c10; --true: #3fcf8f; --true-soft: #12352a;
  --false: #ff6f7d; --false-soft: #3d1a20; --codebg: #0a1322; --codeink: #d5e1f2; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--font-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed;
}
a { color: var(--accent); }
code, pre, .mono-ish code { font-family: var(--font-mono); font-size: 0.88em; }
code, pre, .fc, .chip, .opt, .tag, .tv, .var, .pill, input { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
:not(pre) > code { background: var(--accent-soft); padding: 0.05em 0.35em; border-radius: 4px; white-space: nowrap; }
td :not(pre) > code, .explain :not(pre) > code, dd code { white-space: normal; overflow-wrap: anywhere; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0 0 0.5em; }
h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; margin-top: 1.6em; }
h3 { font-size: 1.12rem; }
h4 { font-size: 1.05rem; margin-top: 1.4em; }
h5, h6 { font: 600 0.72rem/1.3 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 1em 0 0.4em; }
p { margin: 0 0 0.8em; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }

/* ---------- bilingual ---------- */
.bn { font-family: var(--font-bn); }
body[data-lang='en'] .bn, body[data-lang='bn'] .en { display: none !important; }
body[data-lang='both'] .bn { display: block; color: var(--muted); font-size: 0.97em; margin-top: 0.1em; }
body[data-lang='both'] h1 .bn { font-size: 0.62em; font-weight: 600; margin-top: 0.3em; }
body[data-lang='both'] :is(.btn, .chip, .topnav a, summary, th, h5, h6, label, .eyebrow, .qtype, .pill, .tag, .tabs a, .modnav a, .demo-label, .kind, .opt, .score) .bn,
body[data-lang='both'] :is(.mod, .pcard) :is(strong, small) .bn { display: inline; margin: 0; font-size: 1em; color: inherit; }
body[data-lang='both'] :is(.btn, .chip, .topnav a, summary, th, h5, h6, label, .eyebrow, .qtype, .tabs a, .modnav a, .demo-label) .bn::before { content: ' · '; opacity: 0.6; }
body[data-lang='both'] :is(.mod, .pcard) strong .bn { display: block; font-weight: 500; color: var(--muted); }
body[data-lang='both'] :is(.mod, .pcard) small .bn { display: none; }
body[data-lang='both'] .topnav a .bn, body[data-lang='both'] .modnav a .bn { display: none; }
body[data-lang='bn'] .topnav a .bn, body[data-lang='bn'] .modnav a .bn { display: inline; }

/* ---------- shell ---------- */
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 14px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 700 1.02rem/1 var(--font-display); white-space: nowrap; }
.brand svg { flex: none; }
.topnav { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 400px; scrollbar-width: none; }
.topnav a { padding: 6px 10px; border-radius: 6px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.92rem; white-space: nowrap; }
.topnav a:hover { color: var(--ink); background: var(--accent-soft); }
.topnav a[aria-current='page'] { color: var(--accent); background: var(--accent-soft); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; font: 600 0.8rem var(--font-body); cursor: pointer; }
.lang button[aria-pressed='true'] { background: var(--ink); color: var(--panel); }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; }
#app { max-width: 1240px; margin: 0 auto; }
footer { text-align: center; color: var(--muted); font-size: 0.82rem; padding-block: 0 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- buttons, chips ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; border-radius: 8px; font: 600 0.88rem var(--font-body); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme='dark'] .btn.primary { color: #0b1422; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .btn.primary { color: #0b1422; } }
.btn.big { padding: 11px 18px; font-size: 1rem; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; border-radius: 999px; font: 500 0.82rem var(--font-mono); cursor: pointer; text-decoration: none; }
.chip:hover { border-color: var(--accent); }
.chip.sel { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tag { display: inline-block; font: 500 0.74rem var(--font-mono); padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin: 1px 0; }
.diff { font-size: 0.7rem; letter-spacing: 2px; color: var(--hl); }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.err { color: var(--false); font-weight: 500; }
.empty { color: var(--muted); font-style: italic; }
.tv { display: inline-block; font: 700 0.8rem var(--font-mono); padding: 1px 8px; border-radius: 999px; }
.tv.true { background: var(--true-soft); color: var(--true); }
.tv.false { background: var(--false-soft); color: var(--false); }
.tv.xl { font-size: 1.5rem; padding: 4px 16px; }
.arrow { color: var(--muted); margin: 0 6px; }
.pill { display: inline-block; font: 600 0.8rem var(--font-mono); background: var(--hl-soft); color: var(--ink); border: 1px solid var(--hl); padding: 2px 10px; border-radius: 999px; }

/* ---------- hero / home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 32px; align-items: start; margin-bottom: 24px; }
.eyebrow { font: 600 0.74rem/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 0.8em; }
.eyebrow a { text-decoration: none; }
.lede { font-size: 1.1rem; color: var(--muted); max-width: 34em; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.hero-demo { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; box-shadow: 0 10px 30px -18px rgba(20, 36, 58, 0.35); }
.demo-label { font: 600 0.78rem var(--font-body); color: var(--muted); margin-bottom: 8px; }
.wide { max-width: 1100px; }
.objectives { columns: 2 280px; padding-left: 1.2em; }
.objectives li { break-inside: avoid; margin-bottom: 0.4em; }
.modgrid, .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.mod, .pcard { display: flex; flex-direction: column; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-decoration: none; color: var(--ink); }
.mod:hover, .pcard:hover { border-color: var(--accent); }
.mod .num { font: 700 0.75rem var(--font-mono); color: var(--accent); }
.mod small, .pcard small { color: var(--muted); font-size: 0.8rem; }
.ptag { font: 600 0.72rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.ptag.tracing { color: var(--hl); }

/* ---------- docs ---------- */
.two { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
.modnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow: auto; }
.modnav a { display: flex; gap: 10px; padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--muted); font-size: 0.9rem; line-height: 1.35; }
.modnav a .num { font: 700 0.75rem/1.6 var(--font-mono); color: var(--accent); min-width: 1.4em; }
.modnav a[aria-current='page'] { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.doc { max-width: 880px; min-width: 0; }
.wide-doc { max-width: 1240px; }
.doc > p, .doc li { max-width: 70ch; }
.www { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
.www > div { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; }
.www h6 { margin-top: 0; }
.meta2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 8px; }
.meta2 ul { padding-left: 1.2em; margin: 0; }
.blk { margin: 22px 0; }
.blk > h3 { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.warnblk > h3 { color: var(--false); }
.infoblk { background: var(--hl-soft); border: 1px solid var(--hl); border-radius: 10px; padding: 12px 16px; }
.infoblk > h3 { border: 0; }
.note { border-left: 4px solid var(--accent); background: var(--panel); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 14px 0; }
.note strong { display: block; font-size: 0.85rem; margin-bottom: 2px; }
.note.warn { border-color: var(--false); }
.note.tip { border-color: var(--true); }
.note.analogy { border-color: var(--hl); }
.cap { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
summary { cursor: pointer; font-weight: 600; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 36px; flex-wrap: wrap; }
.recap li::marker { content: '✓  '; color: var(--true); }
.statement { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.statement > p { font-family: 'Times New Roman', Georgia, serif; font-size: 1.05rem; }
.io { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
.io dt { font-weight: 600; }
.io dd { margin: 0; }
.explain-list dt { margin-top: 10px; }
.explain-list dd { margin: 4px 0 0 0; }
.pseudo { background: var(--panel); border: 1px dashed var(--line); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; }
.gate { text-align: center; padding: 24px; border: 2px dashed var(--line); border-radius: 12px; margin: 28px 0; }
.kind { font: 600 0.7rem var(--font-mono); text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.kind.Boundary { background: var(--hl-soft); color: var(--ink); }
.kind.Special { background: var(--false-soft); color: var(--false); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
.tabs a { padding: 8px 14px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
.tabs a[aria-selected='true'] { color: var(--accent); border-color: var(--accent); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.picker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.picker select { font: 500 0.95rem var(--font-body); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 100%; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; margin: 12px 0; }
table { border-collapse: collapse; width: 100%; background: var(--panel); font-size: 0.92rem; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--accent-soft); font-weight: 600; }
.samples pre, td pre { margin: 0; font-size: 0.82rem; white-space: pre; }
.tt { width: auto; min-width: 220px; }
.tt td, .tt th { text-align: center; }
.tt tr.hl td { background: var(--hl-soft); outline: 2px solid var(--hl); outline-offset: -2px; }
.ttrow { display: flex; gap: 16px; flex-wrap: wrap; }
.trtable td.chg { font: 700 0.85rem var(--font-mono); color: var(--accent); }

/* ---------- code ---------- */
.code { position: relative; background: var(--codebg); color: var(--codeink); border-radius: 10px; margin: 12px 0; min-width: 0; }
.code pre { margin: 0; padding: 14px 16px; overflow: auto; font-size: 0.84rem; line-height: 1.55; }
.code .copy { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.08); color: var(--codeink); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; font: 600 0.72rem var(--font-body); padding: 3px 8px; cursor: pointer; }
.code .k { color: #ff9e64; } .code .s { color: #9ece6a; } .code .n { color: #e0af68; } .code .c { color: #7f8fa6; font-style: italic; } .code .t { color: #7dcfff; } .code .o { color: #c0caf5; }
.numbered pre { padding-left: 0; }
.ln { display: block; padding-right: 12px; border-left: 3px solid transparent; }
.ln i { display: inline-block; width: 3.2em; text-align: right; padding-right: 1em; color: #5f6f86; font-style: normal; user-select: none; }
.ln.done { background: rgba(110, 166, 255, 0.07); }
.ln.cur { background: rgba(255, 185, 56, 0.22); border-left-color: #ffb938; }
.ln.cur i { color: #ffb938; font-weight: 700; }
.console { background: #0b1220; color: #b7f5c8; font: 0.86rem/1.5 var(--font-mono); padding: 10px 14px; border-radius: 8px; min-height: 2.6em; margin: 0; white-space: pre-wrap; overflow-x: auto; }
.console.final { font-size: 1rem; }

/* ---------- runner ---------- */
[data-runner], .runner { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 14px 0; }
.hero-demo .runner, .hero-demo [data-runner] { border: 0; padding: 0; margin: 0; }
.runner-top { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.inputs { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.inputs label { display: flex; flex-direction: column; gap: 2px; font: 600 0.75rem var(--font-mono); color: var(--muted); }
.inputs input { width: 7.5em; font: 500 0.95rem var(--font-mono); padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.presets { display: flex; gap: 5px; flex-wrap: wrap; }
.runner-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
[data-compact='1'] .runner-body { grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); }
.fcwrap { overflow: auto; background: var(--paper); border-radius: 8px; padding: 8px; text-align: center; }
.fcwrap svg { max-width: 100%; height: auto; }
.side { min-width: 0; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.controls .btn { padding: 6px 10px; }
.stepno { font: 600 0.8rem var(--font-mono); color: var(--muted); margin-left: auto; }
.explain { background: var(--hl-soft); border-left: 4px solid var(--hl); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 10px 0; min-height: 3em; }
body[data-lang='both'] .explain .bn { color: var(--ink); opacity: 0.8; }
.conds { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
.conds li { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.conds code { white-space: normal !important; }

/* flowchart */
.fc { font-family: var(--font-mono); font-size: 12.5px; }
.fc .fn path { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.fc .fn text { fill: var(--ink); }
.fc .fn.diamond path { fill: var(--accent-soft); }
.fc .fn.oval path { fill: var(--ink); }
.fc .fn.oval text { fill: var(--panel); font-weight: 700; }
.fc .fn.dim { opacity: 0.38; }
.fc .fn.on path { stroke: var(--accent); stroke-width: 2.2; }
.fc .fn.yes path { fill: var(--true-soft); stroke: var(--true); }
.fc .fn.no path { fill: var(--false-soft); stroke: var(--false); }
.fc .fn.cur path { stroke: var(--hl); stroke-width: 3.5; fill: var(--hl-soft); }
.fc .fe polyline { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.fc .fe.dim { opacity: 0.3; }
.fc .fe.on polyline { stroke: var(--accent); stroke-width: 2.6; }
.fc .ah { fill: var(--muted); }
.fc .ah.on { fill: var(--accent); }
.fc .el { font-size: 11px; font-weight: 700; }
.fc .el.true { fill: var(--true); }
.fc .el.false { fill: var(--false); }
.fc .fj { fill: var(--muted); }
.fc .fj.on { fill: var(--accent); }

/* tracer */
.tracer { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.tracer:focus-visible { outline: 3px solid var(--hl); }
.tr-code .code { margin: 0; }
.tr-code pre { max-height: 640px; }
.tr-side { min-width: 0; }
.scrub { width: 100%; margin: 10px 0 4px; accent-color: var(--hl); }
.condcard { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-size: 0.88rem; }
.condcard code { white-space: normal !important; }
.condcard .work { margin-top: 4px; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.var { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--paper); display: flex; flex-direction: column; }
.var span { font: 500 0.72rem var(--font-mono); color: var(--muted); }
.var b { font: 700 1rem var(--font-mono); }
.var.b-true b { color: var(--true); } .var.b-false b { color: var(--false); }
.var.changed { border-color: var(--hl); background: var(--hl-soft); }

/* logic */
.logic { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; }
.ops, .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.tog { font: 600 1rem var(--font-mono); padding: 10px 18px; border-radius: 10px; border: 2px solid var(--false); background: var(--false-soft); color: var(--ink); cursor: pointer; }
.tog[aria-pressed='true'] { border-color: var(--true); background: var(--true-soft); }
.bigres { display: flex; align-items: center; gap: 8px; font-size: 1.4rem; flex-wrap: wrap; }
.numlab { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.numlab input { font: 600 1.1rem var(--font-mono); padding: 8px; width: 9em; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); margin-left: 8px; }
.twoout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* quiz */
.quiz { padding-left: 1.4em; display: flex; flex-direction: column; gap: 16px; }
.qq { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.qtype { font: 600 0.7rem var(--font-mono); text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.qtext { font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.opt { text-align: left; font: 500 0.9rem var(--font-mono); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--true); background: var(--true-soft); }
.opt.wrong { border-color: var(--false); background: var(--false-soft); }
.opt:disabled { cursor: default; }
.fb { margin-top: 10px; padding: 8px 12px; border-radius: 8px; }
.fb.ok { background: var(--true-soft); } .fb.bad { background: var(--false-soft); }
.score { font: 600 1rem var(--font-mono); }

/* revision */
.revgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.check { list-style: none; padding: 0; }
.check li { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .hero, .two, .runner-body, [data-compact='1'] .runner-body, .tracer, .revgrid { grid-template-columns: minmax(0, 1fr); }
  .modnav { position: static; flex-direction: row; overflow-x: auto; max-height: none; }
  .modnav a { white-space: nowrap; }
}
@media (max-width: 640px) {
  .www, .meta2, .twoout { grid-template-columns: minmax(0, 1fr); }
  .brand span { display: none; }
  .stepno { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .fc .fe polyline, .fc .fn path { transition: stroke 0.25s, fill 0.25s, stroke-width 0.25s; }
}

/* ---------- print (use the browser's Print → Save as PDF) ---------- */
@media print {
  body { background: #fff; color: #000; }
  .bar, footer, .controls, .scrub, .gate, .presets, .inputs, .pager, .copy { display: none !important; }
  .solution[hidden] { display: block !important; }
  .code, .console { background: #f3f5f8 !important; color: #111 !important; }
  .code .k, .code .s, .code .n, .code .t, .code .o { color: #111 !important; }
  .blk, .runner, table, .code { break-inside: avoid; }
}
.fc .fn.oval.cur text { fill: var(--ink); }

 \u098F\u0987 \u09B8\u09BF\u09A6\u09CD\u09A7\u09BE\u09A8\u09CD\u09A4 \u09A8\u09BF\u0987\u0964 Program \u0995\u09C7 \u09A0\u09BF\u0995 \u0995\u09C0\u09AD\u09BE\u09AC\u09C7 \u09A8\u09BF\u09A4\u09C7 \u09B9\u09AC\u09C7 \u09A4\u09BE \u09AC\u09B2\u09C7 \u09A6\u09BF\u09A4\u09C7 \u09B9\u09AF\u09BC\u0964")},{k:"code",code:`boolean isRaining = true;

    System.out.println("Take an umbrella");

utput:"Divisible by Both"},{kind:"Special",input:"0",walk:e("0 % 5 = 0 and 0 % 7 = 0, so 0 counts as divisible by both. This is mathematically correct, but a good class question.","0 % 5 = 0 \u098F\u09AC\u0982 0 % 7 = 0, \u09A4\u09BE\u0987 0 \u09A6\u09C1\u099F\u09CB \u09A6\u09BF\u09AF\u09BC\u09C7\u0987 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF\u0964 \u0997\u09BE\u09A3\u09BF\u09A4\u09BF\u0995\u09AD\u09BE\u09AC\u09C7 \u09A0\u09BF\u0995, \u09A4\u09AC\u09C7 class \u098F \u099C\u09BF\u099C\u09CD\u099E\u09C7\u09B8 \u0995\u09B0\u09BE\u09B0 \u09AE\u09A4\u09CB \u09AA\u09CD\u09B0\u09B6\u09CD\u09A8\u0964"),output:"Divisible by Both"}],mistakes:[e('Checking % 5 before the "both" case, which makes "Divisible by Both" unreachable.','"Both" \u098F\u09B0 \u0986\u0997\u09C7 % 5 check \u0995\u09B0\u09BE \u2014 \u09A4\u0996\u09A8 "Divisible by Both" \u098F \u0995\u0996\u09A8\u09CB \u09AA\u09CC\u0981\u099B\u09BE\u09A8\u09CB \u09AF\u09BE\u09AF\u09BC \u09A8\u09BE\u0964'),e("Writing number / 5 == 0. Division gives the quotient, not the remainder.","number / 5 == 0 \u09B2\u09C7\u0996\u09BE\u0964 / \u09AD\u09BE\u0997\u09AB\u09B2 \u09A6\u09C7\u09AF\u09BC, \u09AD\u09BE\u0997\u09B6\u09C7\u09B7 \u09A8\u09BE\u0964"),e('Typos in the output text, e.g. "Divisible by both" instead of "Divisible by Both".','Output text \u098F \u09AD\u09C1\u09B2, \u09AF\u09C7\u09AE\u09A8 "Both" \u098F\u09B0 \u09AC\u09A6\u09B2\u09C7 "both"\u0964')],ambiguity:[e('The statement says "Invalid" but the samples print "Invalid: Divisible by 5 Only" etc. The solution prints the sample text exactly.','Statement \u098F \u09B6\u09C1\u09A7\u09C1 "Invalid" \u09AC\u09B2\u09BE, \u0995\u09BF\u09A8\u09CD\u09A4\u09C1 sample \u098F "Invalid: Divisible by 5 Only" \u0987\u09A4\u09CD\u09AF\u09BE\u09A6\u09BF\u0964 Solution \u09B9\u09C1\u09AC\u09B9\u09C1 sample \u098F\u09B0 text print \u0995\u09B0\u09C7\u0964')],practice:{q:e('Additional practice: print "FizzBuzz" if divisible by 3 and 5, "Fizz" for only 3, "Buzz" for only 5, else the number.','\u0985\u09A4\u09BF\u09B0\u09BF\u0995\u09CD\u09A4 \u0985\u09A8\u09C1\u09B6\u09C0\u09B2\u09A8: 3 \u0993 5 \u09A6\u09C1\u099F\u09CB \u09A6\u09BF\u09AF\u09BC\u09C7 \u09B9\u09B2\u09C7 "FizzBuzz", \u09B6\u09C1\u09A7\u09C1 3 \u09B9\u09B2\u09C7 "Fizz", \u09B6\u09C1\u09A7\u09C1 5 \u09B9\u09B2\u09C7 "Buzz", \u09A8\u09BE\u09B9\u09B2\u09C7 \u09B8\u0982\u0996\u09CD\u09AF\u09BE\u099F\u09BE\u0964'),hint:e("Same shape as this problem. Which check comes first?","\u098F\u0987 problem \u098F\u09B0 \u09AE\u09A4\u09CB\u0987 \u0997\u09A0\u09A8\u0964 \u0995\u09CB\u09A8\u099F\u09BE \u0986\u0997\u09C7 check \u09B9\u09AC\u09C7?"),a:e("Check (n % 3 == 0 && n % 5 == 0) first, then % 3, then % 5, then else.","\u0986\u0997\u09C7 (n % 3 == 0 && n % 5 == 0), \u09A4\u09BE\u09B0\u09AA\u09B0 % 3, \u09A4\u09BE\u09B0\u09AA\u09B0 % 5, \u09B6\u09C7\u09B7\u09C7 else\u0964")}},{id:"lab-4",set:"lab",kind:"coding",num:4,title:e("Leap year","Leap year"),statement:"The Registrar\u2019s Office at a University is preparing the academic calendar for upcoming sessions. Before finalizing the schedule, they need to determine whether a given year will have February 29 because leap years affect semester dates, holidays, and exam schedules. To automate this, they\u2019ve asked you to write a simple Java program that checks whether a year is a leap year or not, following the standard rules:",bullets:["A year is a leap year if it is divisible by 4.","However, if the year is a century (divisible by 100), it must also be divisible by 400 to be a leap year."],samples:[{input:"2020",output:"2020 is a leap year"},{input:"2001",output:"2001 is not a leap year"},{input:"1900",output:"1900 is not a leap year"},{input:"2000",output:"2000 is a leap year"}],difficulty:2,concepts:["%","if-else-if","most specific condition first"],knowledge:e("Rules with exceptions; ordering from specific to general","Exception \u09B8\u09B9 \u09A8\u09BF\u09AF\u09BC\u09AE; \u09A8\u09BF\u09B0\u09CD\u09A6\u09BF\u09B7\u09CD\u099F \u09A5\u09C7\u0995\u09C7 \u09B8\u09BE\u09A7\u09BE\u09B0\u09A3 \u0995\u09CD\u09B0\u09AE"),overview:e("A year divisible by 4 is usually a leap year. Century years (1900, 2000) are the exception: they need to be divisible by 400.","\u09AF\u09C7 \u09AC\u099B\u09B0 4 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF \u09B8\u09C7\u099F\u09BE \u09B8\u09BE\u09A7\u09BE\u09B0\u09A3\u09A4 leap year\u0964 \u09AC\u09CD\u09AF\u09A4\u09BF\u0995\u09CD\u09B0\u09AE \u09B9\u09B2\u09CB \u09B6\u09A4\u09BE\u09AC\u09CD\u09A6\u09C0 \u09AC\u099B\u09B0 (1900, 2000): \u098F\u0997\u09C1\u09B2\u09CB\u0995\u09C7 400 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF \u09B9\u09A4\u09C7 \u09B9\u09AC\u09C7\u0964"),io:{input:e("A year (int)","\u098F\u0995\u099F\u09BF \u09AC\u099B\u09B0 (int)"),output:e("<year> is a leap year / <year> is not a leap year","<year> is a leap year / <year> is not a leap year"),check:e("% 400, % 100, % 4 \u2014 in that order","% 400, % 100, % 4 \u2014 \u098F\u0987 \u0995\u09CD\u09B0\u09AE\u09C7")},strategy:e("Go from the most specific rule to the most general. Divisible by 400 \u2192 leap. Otherwise divisible by 100 \u2192 not leap (century). Otherwise divisible by 4 \u2192 leap. Otherwise \u2192 not leap. Every year that reaches a step has already failed the steps above it.","\u09B8\u09AC\u099A\u09C7\u09AF\u09BC\u09C7 \u09A8\u09BF\u09B0\u09CD\u09A6\u09BF\u09B7\u09CD\u099F \u09A8\u09BF\u09AF\u09BC\u09AE \u09A5\u09C7\u0995\u09C7 \u09B8\u09BE\u09A7\u09BE\u09B0\u09A3 \u09A8\u09BF\u09AF\u09BC\u09AE\u09C7 \u09AF\u09BE\u0987\u0964 400 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF \u2192 leap\u0964 \u09A8\u09BE \u09B9\u09B2\u09C7 100 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF \u2192 leap \u09A8\u09BE (\u09B6\u09A4\u09BE\u09AC\u09CD\u09A6\u09C0)\u0964 \u09A8\u09BE \u09B9\u09B2\u09C7 4 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF \u2192 leap\u0964 \u09A8\u09BE \u09B9\u09B2\u09C7 \u2192 leap \u09A8\u09BE\u0964 \u09AA\u09CD\u09B0\u09A4\u09BF\u099F\u09BF \u09A7\u09BE\u09AA\u09C7 \u09AA\u09CC\u0981\u099B\u09BE\u09A8\u09CB \u09AE\u09BE\u09A8\u09C7 \u0989\u09AA\u09B0\u09C7\u09B0 \u09B8\u09AC \u09A7\u09BE\u09AA false \u09B9\u09AF\u09BC\u09C7\u099B\u09C7\u0964"),pseudocode:`READ year

ELSE IF year % 4 == 0    PRINT year + " is a leap year"
ELSE                     PRINT year + " is not a leap year"`,conditions:[{cond:"year % 400 == 0",meaning:e("century divisible by 400","400 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF \u09B6\u09A4\u09BE\u09AC\u09CD\u09A6\u09C0"),action:"leap",example:"2000"},{cond:"year % 100 == 0",meaning:e("other century","\u0985\u09A8\u09CD\u09AF \u09B6\u09A4\u09BE\u09AC\u09CD\u09A6\u09C0 \u09AC\u099B\u09B0"),action:"not leap",example:"1900"},{cond:"year % 4 == 0",meaning:e("ordinary year divisible by 4","4 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF \u09B8\u09BE\u09A7\u09BE\u09B0\u09A3 \u09AC\u099B\u09B0"),action:"leap",example:"2020"},{cond:"else",meaning:e("not divisible by 4","4 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF \u09A8\u09BE"),action:"not leap",example:"2001"}],programId:"lab-4",java:Ne,className:"LeapYear",explain:[{code:"if (year % 400 == 0)",t:e("The rarest and most specific case first.","\u09B8\u09AC\u099A\u09C7\u09AF\u09BC\u09C7 \u09AC\u09BF\u09B0\u09B2 \u0993 \u09A8\u09BF\u09B0\u09CD\u09A6\u09BF\u09B7\u09CD\u099F case \u0986\u0997\u09C7\u0964")},{code:"else if (year % 100 == 0)",t:e("Century but not divisible by 400.","\u09B6\u09A4\u09BE\u09AC\u09CD\u09A6\u09C0 \u0995\u09BF\u09A8\u09CD\u09A4\u09C1 400 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF \u09A8\u09BE\u0964")},{code:'year + " is a leap year"',t:e("+ joins the number and the text.","+ \u09B8\u0982\u0996\u09CD\u09AF\u09BE \u0986\u09B0 text \u099C\u09CB\u09A1\u09BC\u09BE \u09B2\u09BE\u0997\u09BE\u09AF\u09BC\u0964")}],dryRuns:[{kind:"Normal",input:"2020",walk:e("400? 20 left over, no. 100? no. 4? yes \u2192 leap.","400? \u09A8\u09BE\u0964 100? \u09A8\u09BE\u0964 4? \u09B9\u09CD\u09AF\u09BE\u0981 \u2192 leap\u0964"),output:"2020 is a leap year"},{kind:"Special",input:"1900",walk:e("400? no. 100? yes \u2192 not leap. It is divisible by 4 too, but we never get that far.","400? \u09A8\u09BE\u0964 100? \u09B9\u09CD\u09AF\u09BE\u0981 \u2192 leap \u09A8\u09BE\u0964 4 \u09A6\u09BF\u09AF\u09BC\u09C7\u0993 \u09AC\u09BF\u09AD\u09BE\u099C\u09CD\u09AF, \u0995\u09BF\u09A8\u09CD\u09A4\u09C1 \u0993\u0987 \u09A7\u09BE\u09AA\u09C7 \u0986\u09B0 \u09AF\u09BE\u0993\u09AF\u09BC\u09BE\u0987 \u09B9\u09AF\u09BC \u09A8\u09BE\u0964"),output:"1900 is not a leap year"},{kind:"Boundary",input:"2000",walk:e("400? yes \u2192 leap.","400? \u09B9\u09CD\u09AF\u09BE\u0981 \u2192 leap\u0964"),output:"2000 is a leap year"}],mistakes:[e("Checking % 4 first. Then 1900 is reported as a leap year.","\u0986\u0997\u09C7 % 4 check \u0995\u09B0\u09BE\u0964 \u09A4\u0996\u09A8 1900 \u0995\u09C7 leap year \u09AC\u09B2\u09C7 \u09A6\u09C7\u09AF\u09BC\u0964"),e("Checking % 100 before % 400. Then 2000 is reported as not leap.","% 400 \u098F\u09B0 \u0986\u0997\u09C7 % 100 check \u0995\u09B0\u09BE\u0964 \u09A4\u0996\u09A8 2000 \u0995\u09C7 leap \u09A8\u09BE \u09AC\u09B2\u09C7\u0964")],extension:{title:e("Alternative: one combined condition","\u09AC\u09BF\u0995\u09B2\u09CD\u09AA: \u098F\u0995\u099F\u09BF\u09AE\u09BE\u09A4\u09CD\u09B0 combined condition"),t:e("The same rule in a single boolean expression. Good for practising && and ||.","\u098F\u0995\u0987 \u09A8\u09BF\u09AF\u09BC\u09AE \u098F\u0995\u099F\u09BE boolean expression \u098F\u0964 && \u0986\u09B0 || \u0985\u09A8\u09C1\u09B6\u09C0\u09B2\u09A8\u09C7\u09B0 \u099C\u09A8\u09CD\u09AF \u09AD\u09BE\u09B2\u09CB\u0964"),code:`if ((year % 4 == 0 && year % 100 != 0) || year % 400 == 0) {
    System.out.println(year + " is a leap year");
} else {
    System.out.println(year + " is not a leap year");
}`},practice:{q:e("Additional practice: is 2100 a leap year? Trace it through the ladder before running it.","\u0985\u09A4\u09BF\u09B0\u09BF\u0995\u09CD\u09A4 \u0985\u09A8\u09C1\u09B6\u09C0\u09B2\u09A8: 2100 \u0995\u09BF leap year? \u099A\u09BE\u09B2\u09BE\u09A8\u09CB\u09B0 \u0986\u0997\u09C7 ladder \u09A6\u09BF\u09AF\u09BC\u09C7 trace \u0995\u09B0\u09CB\u0964"),hint:e("Start with % 400.","% 400 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09B6\u09C1\u09B0\u09C1 \u0995\u09B0\u09CB\u0964"),a:e("2100 % 400 = 100 (no), 2100 % 100 = 0 (yes) \u2192 not a leap year.","2100 % 400 = 100 (\u09A8\u09BE), 2100 % 100 = 0 (\u09B9\u09CD\u09AF\u09BE\u0981) \u2192 leap year \u09A8\u09BE\u0964")}},{id:"lab-5",set:"lab",kind:"coding",num:5,title:e("Piecewise function","Piecewise function"),statement:"It\u2019s 11:59 PM, and Harun is desperately trying to finish a math assignment before the deadline. The final question involves a strange piecewise function, and Harun needs to write a program to verify the answers before submitting. The function is defined as follows: f(x) = 2x if x < 0; x + 1 if 0 \u2264 x < 2; x\xB2 \u2212 1 if 2 \u2264 x < 5; 3x\xB2 + 2 if x \u2265 5. Your task is to help Harun by writing a Java program that takes the value of x as input from the user and displays the corresponding value of f(x) according to the formula.",samples:[{input:"-3",output:"output: -6"},{input:"1",output:"output: 2"},{input:"4",output:"output: 15"},{input:"10",output:"output: 302"}],difficulty:2,concepts:["if-else-if over ranges","arithmetic expressions","boundary values"],knowledge:e("Turning interval notation into conditions without gaps or overlaps","Interval notation \u0995\u09C7 gap/overlap \u099B\u09BE\u09A1\u09BC\u09BE condition \u098F \u09B0\u09C2\u09AA\u09BE\u09A8\u09CD\u09A4\u09B0"),overview:e("f(x) uses a different formula depending on which range x is in. Find the range, then apply its formula.","x \u0995\u09CB\u09A8 range \u098F \u0986\u099B\u09C7 \u09A4\u09BE\u09B0 \u0989\u09AA\u09B0 \u09A8\u09BF\u09B0\u09CD\u09AD\u09B0 \u0995\u09B0\u09C7 f(x) \u098F\u09B0 formula \u09AC\u09A6\u09B2\u09BE\u09AF\u09BC\u0964 \u0986\u0997\u09C7 range \u09AC\u09C7\u09B0 \u0995\u09B0\u09CB, \u09A4\u09BE\u09B0\u09AA\u09B0 \u09B8\u09C7\u0987 formula \u09AA\u09CD\u09B0\u09AF\u09BC\u09CB\u0997 \u0995\u09B0\u09CB\u0964"),io:{input:e("x (int, as in the samples)","x (int, sample \u0985\u09A8\u09C1\u09AF\u09BE\u09AF\u09BC\u09C0)"),output:e("output: <f(x)>","output: <f(x)>"),check:e("x < 0, x < 2, x < 5, otherwise","x < 0, x < 2, x < 5, \u09A8\u09BE\u09B9\u09B2\u09C7")},strategy:e("The four ranges sit next to each other on the number line: (\u2212\u221E, 0), [0, 2), [2, 5), [5, \u221E). Walk left to right. When we test x < 2, we already know x >= 0 because the first test failed \u2014 so the ladder needs only the upper bound each time.","\u099A\u09BE\u09B0\u099F\u09BE range number line \u098F \u09AA\u09BE\u09B6\u09BE\u09AA\u09BE\u09B6\u09BF: (\u2212\u221E, 0), [0, 2), [2, 5), [5, \u221E)\u0964 \u09AC\u09BE\u09AE \u09A5\u09C7\u0995\u09C7 \u09A1\u09BE\u09A8\u09C7 \u09AF\u09BE\u0987\u0964 x < 2 check \u0995\u09B0\u09BE\u09B0 \u09B8\u09AE\u09AF\u09BC \u0986\u09AE\u09B0\u09BE \u099C\u09BE\u09A8\u09BF x >= 0, \u0995\u09BE\u09B0\u09A3 \u09AA\u09CD\u09B0\u09A5\u09AE check false \u099B\u09BF\u09B2 \u2014 \u09A4\u09BE\u0987 \u09AA\u09CD\u09B0\u09A4\u09BF\u09AC\u09BE\u09B0 \u09B6\u09C1\u09A7\u09C1 \u0989\u09AA\u09B0\u09C7\u09B0 \u09B8\u09C0\u09AE\u09BE \u09A6\u09BF\u09B2\u09C7\u0987 \u099A\u09B2\u09C7\u0964"),pseudocode:`READ x
IF x < 0        result = 2x
ELSE IF x < 2   result = x + 1        (0 <= x < 2)

public class ChargingStation {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.print("Age: ");
        int age = sc.nextInt();
        System.out.print("Electricity Consumed: ");
        double kwh = sc.nextDouble();

        // Step 1: base bill
        double bill = kwh * 15;

        // Step 2: age-based discount
        if (age < 18) {
            bill = bill - bill * 20 / 100;      // student: 20% off
        } else if (age > 60) {
            bill = bill - bill * 10 / 100;      // senior: 10% off
        }
        // 18 to 60: regular user, no change

        // Step 3: high-usage surcharge AFTER the discount
        if (kwh > 100) {
            bill = bill + bill * 5 / 100;       // 5% surcharge
        }

        // Step 4: final bill
        System.out.println("Final Bill: " + bill + " Taka");
    }
}

0 > 100 \u2192 1620 + 81 = 1701\u0964"),output:"Final Bill: 1701.0 Taka"},{kind:"Boundary",input:"30 100",walk:e('1500. Regular. 100 > 100 is false ("exceeds" means strictly more) \u2192 no surcharge.','1500\u0964 Regular\u0964 100 > 100 false ("exceeds" \u09AE\u09BE\u09A8\u09C7 \u09AC\u09C7\u09B6\u09BF) \u2192 surcharge \u09A8\u09C7\u0987\u0964'),output:"Final Bill: 1500.0 Taka"},{kind:"Boundary",input:"18 101",walk:e("1515. Age 18 is regular. 101 > 100 \u2192 1515 + 75.75 = 1590.75.","1515\u0964 18 \u09AC\u099B\u09B0 regular\u0964 101 > 100 \u2192 1590.75\u0964"),output:"Final Bill: 1590.75 Taka"}],mistakes:[e('Ignoring the stated order. With two percentages the final number comes out the same either way (multiplication can be reordered), but the rule says "after" and the order matters as soon as a rule uses a fixed amount such as "add 50 Taka". Write the steps in the order the problem gives.','\u09AC\u09B2\u09BE \u0995\u09CD\u09B0\u09AE \u09A8\u09BE \u09AE\u09BE\u09A8\u09BE\u0964 \u09A6\u09C1\u099F\u09CB\u0987 \u09B6\u09A4\u09BE\u0982\u09B6 \u09B9\u09B2\u09C7 \u09AF\u09C7\u0995\u09CB\u09A8\u09CB \u0995\u09CD\u09B0\u09AE\u09C7 \u09AB\u09B2 \u098F\u0995\u0987 \u0986\u09B8\u09C7 (\u0997\u09C1\u09A3\u09C7\u09B0 \u0995\u09CD\u09B0\u09AE \u09AC\u09A6\u09B2\u09BE\u09A8\u09CB \u09AF\u09BE\u09AF\u09BC), \u0995\u09BF\u09A8\u09CD\u09A4\u09C1 \u09A8\u09BF\u09AF\u09BC\u09AE\u09C7 "after" \u09AC\u09B2\u09BE \u0986\u099B\u09C7, \u0986\u09B0 "50 \u099F\u09BE\u0995\u09BE \u09AF\u09CB\u0997" \u098F\u09B0 \u09AE\u09A4\u09CB \u09A8\u09BF\u09B0\u09CD\u09A6\u09BF\u09B7\u09CD\u099F \u09AA\u09B0\u09BF\u09AE\u09BE\u09A3 \u098F\u09B2\u09C7\u0987 \u0995\u09CD\u09B0\u09AE \u09AC\u09A6\u09B2\u09BE\u09B2\u09C7 \u0989\u09A4\u09CD\u09A4\u09B0 \u09AC\u09A6\u09B2\u09BE\u09AF\u09BC\u0964 Problem \u098F \u09AF\u09C7 \u0995\u09CD\u09B0\u09AE, \u09B8\u09C7\u0987 \u0995\u09CD\u09B0\u09AE\u09C7 \u09B2\u09C7\u0996\u09CB\u0964'),e("Putting the surcharge inside the age ladder as an else if \u2014 then only some users get it.","Surcharge \u0995\u09C7 age ladder \u098F\u09B0 else if \u09AC\u09BE\u09A8\u09BE\u09A8\u09CB \u2014 \u09A4\u0996\u09A8 \u0995\u09BF\u099B\u09C1 user surcharge \u09AA\u09BE\u09AF\u09BC \u09A8\u09BE\u0964"),e("Using integer arithmetic: int bill with bill * 20 / 100 can drop fractions.","int bill \u09A8\u09BF\u09AF\u09BC\u09C7 \u09B9\u09BF\u09B8\u09BE\u09AC \u2014 \u09AD\u0997\u09CD\u09A8\u09BE\u0982\u09B6 \u09B9\u09BE\u09B0\u09BF\u09AF\u09BC\u09C7 \u09AF\u09C7\u09A4\u09C7 \u09AA\u09BE\u09B0\u09C7\u0964"),e("Using >= 60 for seniors. 60 is in the regular group (18 to 60).","Senior \u098F\u09B0 \u099C\u09A8\u09CD\u09AF >= 60 \u09B2\u09C7\u0996\u09BE\u0964 60 regular group (18 to 60) \u098F \u09AA\u09A1\u09BC\u09C7\u0964")],ambiguity:[e('"Exceeds 100 kWh" is read as kwh > 100, so exactly 100 kWh has no surcharge.','"exceeds 100 kWh" \u0995\u09C7 kwh > 100 \u09A7\u09B0\u09BE \u09B9\u09AF\u09BC\u09C7\u099B\u09C7, \u09A4\u09BE\u0987 \u09A0\u09BF\u0995 100 \u098F surcharge \u09A8\u09C7\u0987\u0964'),e("Why bill * 20 / 100 instead of bill * 0.8: decimals like 0.9 and 1.05 cannot be stored exactly in binary, so bill * 0.9 * 1.05 may print 1701.0000000000002. Multiplying by a whole number and dividing by 100 keeps the sample outputs exact. Tell students this is a floating-point detail, not a logic change.","bill * 0.8 \u098F\u09B0 \u09AC\u09A6\u09B2\u09C7 bill * 20 / 100 \u0995\u09C7\u09A8: 0.9, 1.05 \u098F\u09B0 \u09AE\u09A4\u09CB \u09A6\u09B6\u09AE\u09BF\u0995 binary \u09A4\u09C7 \u09B9\u09C1\u09AC\u09B9\u09C1 \u09B0\u09BE\u0996\u09BE \u09AF\u09BE\u09AF\u09BC \u09A8\u09BE, \u09A4\u09BE\u0987 1701.0000000000002 \u098F\u09B0 \u09AE\u09A4\u09CB \u0986\u09B8\u09A4\u09C7 \u09AA\u09BE\u09B0\u09C7\u0964 \u09AA\u09C2\u09B0\u09CD\u09A3\u09B8\u0982\u0996\u09CD\u09AF\u09BE \u09A6\u09BF\u09AF\u09BC\u09C7 \u0997\u09C1\u09A3 \u0995\u09B0\u09C7 100 \u09A6\u09BF\u09AF\u09BC\u09C7 \u09AD\u09BE\u0997 \u0995\u09B0\u09B2\u09C7 sample output \u09B9\u09C1\u09AC\u09B9\u09C1 \u0 7 \u2014 \u09A6\u09C1\u099F\u09CB\u0987 \u099A\u09B2\u09A4\u09C7 \u09AA\u09BE\u09B0\u09C7\u0964"),pseudocode:`READ a, b, c
